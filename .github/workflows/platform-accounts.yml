name: Platform accounts foundation
on:
  push:
    branches: [feat/platform-accounts, feat/platform-entitlements]
  pull_request:
    paths:
      - 'db/migrations/**'
      - 'lib/platform/accounts/**'
      - 'lib/platform/entitlements/**'
      - 'app/api/platform/v1/**'
      - 'app/account/**'
      - 'app/login/**'
      - 'app/signup/**'
      - 'app/forgot-password/**'
      - 'app/reset-password/**'
      - 'app/zh/account/**'
      - 'app/zh/login/**'
      - 'app/zh/signup/**'
      - 'app/zh/forgot-password/**'
      - 'app/zh/reset-password/**'
      - 'components/AccountPortal*'
      - 'components/AccountEntitlements*'
      - 'components/ApiKeyModal.js'
      - 'components/StandaloneShell.js'
      - 'messages/*/common.json'
      - 'messages/*/accounts.json'
      - 'tests/platform*'
      - 'tests/support/accountInbox.mjs'
      - 'e2e/**'
      - 'playwright.config.mjs'
      - 'lib/platform/captions/**'
      - 'components/*Caption*'
      - 'components/WordTimingEditor*'
      - 'playwright.accounts.config.mjs'
      - 'scripts/migrate-platform-auth.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/platform-accounts.yml'

permissions:
  contents: read

jobs:
  accounts:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_test
      PGSSLMODE: disable
      BETTER_AUTH_SECRET: local-ci-only-not-for-production-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      PLATFORM_STARTER_CREDITS: '25'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_FROM: 'Studio Tests <noreply@example.test>'
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Contract and runtime configuration tests
        run: node --test tests/platformAccounts.test.mjs tests/platformAuthConfig.test.mjs
      - name: Full Node regression suite
        run: npm test
      - name: Migrate and test fresh/populated platform schema
        run: bash tests/platformAccounts.pg.sh
      - name: Apply maintained Better Auth schema migrations
        run: node scripts/migrate-platform-auth.mjs
      - name: Confirm SMTP test inbox is reachable
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8025/api/v1/messages >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Live signup, email verification, login, session and rate-limit checks
        run: node --test tests/platformAuth.integration.mjs
      - name: Build project workspaces
        run: npm run build:packages
      - name: Verify Next production build
        run: npm run build
      - name: HTTP smoke of localized account pages and private API boundary
        env:
          AUTH_TRUSTED_IP_HEADER: x-test-ingress-ip
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > /tmp/platform-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login >/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then cat /tmp/platform-next.log; exit 1; fi
            sleep 1
          done
          node --test tests/platformAuth.http.mjs tests/platformEntitlements.http.mjs
      - name: Install Chromium for account browser tests
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Verify caption editing, word timing and SRT downloads in Chromium
        run: npx --no-install playwright test --workers=2
      - name: Verify English and Chinese account journeys in Chromium
        env:
          BETTER_AUTH_URL: http://localhost:3214
        run: npx --no-install playwright test -c playwright.accounts.config.mjs
