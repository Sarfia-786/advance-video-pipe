name: Complete repository CI (4 CPU)

on:
  push:
    branches:
      - feat/unified-dashboard-navigation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-repo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_test
      PGSSLMODE: disable
      BETTER_AUTH_SECRET: local-ci-only-not-for-production-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      PLATFORM_STARTER_CREDITS: '25'
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      SMTP_FROM: 'Studio Tests <noreply@example.test>'
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Runner limits
        run: |
          echo "Available CPUs: $(nproc)"
          free -h
          node --version
          npm --version
      - name: Install lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate full AI-model inventory without downloading weights
        run: node scripts/audit-model-catalog.mjs
      - name: Upload full model inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-audit
          path: artifacts/model-audit/
          if-no-files-found: warn
          retention-days: 14
      - name: Full Node unit and regression suite (two test workers)
        run: npm test -- --test-concurrency=2
      - name: PostgreSQL migration and ownership/credit race tests
        run: bash tests/platformAccounts.pg.sh
      - name: Install Better Auth database migrations
        run: node scripts/migrate-platform-auth.mjs
      - name: Check local test inbox
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8025/api/v1/messages >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Live account, email and session integration tests
        run: node --test --test-concurrency=2 tests/platformAuth.integration.mjs
      - name: Build all workspace packages
        run: npm run build:packages
      - name: Build Next.js production application
        run: npm run build
      - name: Check authenticated platform HTTP routes against production server
        env:
          AUTH_TRUSTED_IP_HEADER: x-test-ingress-ip
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 >/tmp/platform-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login >/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then cat /tmp/platform-next.log; exit 1; fi
            sleep 1
          done
          node --test --test-concurrency=2 tests/platformAuth.http.mjs tests/platformEntitlements.http.mjs
      - name: Install headless Chromium and dependencies
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: Test both locales and studio routes in Chromium (two workers)
        run: npx --no-install playwright test --workers=2
      - name: Test signup, billing access and account lifecycle in Chromium
        env:
          BETTER_AUTH_URL: http://localhost:3214
        run: npx --no-install playwright test --config=playwright.accounts.config.mjs --workers=2
      - name: Add CI note
        if: always()
        run: |
          echo "## Runner scope" >> "$GITHUB_STEP_SUMMARY"
          echo "Builds and runs automated tests on a 4-vCPU public Linux runner. GPU inference and live third-party provider calls are intentionally excluded." >> "$GITHUB_STEP_SUMMARY"
